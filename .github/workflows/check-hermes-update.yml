name: Check Hermes Update

on:
  workflow_dispatch:

  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

jobs:
  check-update:
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------
      # 1. Checkout Repo 1
      # --------------------------------------------------
      - name: Checkout Update Builder
        uses: actions/checkout@v4


      # --------------------------------------------------
      # 2. Check Repo 2 for new commit
      # --------------------------------------------------
      - name: Check Repo 2 latest commit
        id: check
        env:
          REPO2: https://github.com/davpatel605-beep/hermes-android-test-source.git
        run: |
          echo "Checking Repo 2..."

          LATEST_COMMIT=$(git ls-remote "$REPO2" refs/heads/main | awk '{print $1}')

          if [ -z "$LATEST_COMMIT" ]; then
            echo "ERROR: Could not find Repo 2."
            exit 1
          fi

          echo "Latest Repo 2 commit:"
          echo "$LATEST_COMMIT"

          mkdir -p config

          if [ ! -f config/repo2-commit.txt ]; then

            echo "$LATEST_COMMIT" > config/repo2-commit.txt

            echo "FIRST_RUN=true" >> "$GITHUB_OUTPUT"
            echo "UPDATE_FOUND=false" >> "$GITHUB_OUTPUT"

            echo "First run."
            echo "Baseline version saved."

          else

            OLD_COMMIT=$(cat config/repo2-commit.txt)

            echo "Previous commit:"
            echo "$OLD_COMMIT"

            if [ "$OLD_COMMIT" = "$LATEST_COMMIT" ]; then

              echo "UPDATE_FOUND=false" >> "$GITHUB_OUTPUT"

              echo "No new update found."

            else

              echo "$LATEST_COMMIT" > config/repo2-commit.txt

              echo "UPDATE_FOUND=true" >> "$GITHUB_OUTPUT"

              echo "NEW UPDATE FOUND!"

            fi

          fi


      # --------------------------------------------------
      # 3. Save detected commit
      # --------------------------------------------------
      - name: Save detected version
        if: steps.check.outputs.UPDATE_FOUND == 'true' || steps.check.outputs.FIRST_RUN == 'true'
        run: |
          git config user.name "Hermes Update Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add config/repo2-commit.txt

          git commit -m "Update tracked Hermes source version" || echo "Nothing to commit"

          git push


      # --------------------------------------------------
      # 4. Download latest Repo 2 source
      # --------------------------------------------------
      - name: Download latest Repo 2 source
        if: steps.check.outputs.UPDATE_FOUND == 'true'
        env:
          REPO2: https://github.com/davpatel605-beep/hermes-android-test-source.git
        run: |
          echo "Downloading latest Repo 2 source..."

          rm -rf downloaded-hermes

          git clone --depth 1 "$REPO2" downloaded-hermes

          echo "Repo 2 downloaded successfully."

          echo "Files received from Repo 2:"
          find downloaded-hermes -maxdepth 4 -type f | sort | head -200


      # --------------------------------------------------
      # 5. Verify downloaded source
      # --------------------------------------------------
      - name: Verify downloaded source
        if: steps.check.outputs.UPDATE_FOUND == 'true'
        run: |
          echo "Checking downloaded source..."

          if [ ! -d "downloaded-hermes" ]; then
            echo "ERROR: downloaded-hermes directory missing."
            exit 1
          fi

          if [ ! -f "downloaded-hermes/README.md" ]; then
            echo "WARNING: README.md not found."
          fi

          if [ ! -d "downloaded-hermes/app" ]; then
            echo "ERROR: Android app directory not found."
            exit 1
          fi

          if [ ! -f "downloaded-hermes/app/src/main/AndroidManifest.xml" ]; then
            echo "ERROR: AndroidManifest.xml not found."
            exit 1
          fi

          echo "Source verification PASSED."


      # --------------------------------------------------
      # 6. Show Android project information
      # --------------------------------------------------
      - name: Inspect Android project
        if: steps.check.outputs.UPDATE_FOUND == 'true'
        working-directory: downloaded-hermes
        run: |
          echo "Inspecting Android project..."

          echo "Root files:"
          find . -maxdepth 2 -type f | sort | head -200

          echo ""
          echo "AndroidManifest:"
          sed -n '1,120p' app/src/main/AndroidManifest.xml || true

          echo ""
          echo "Gradle files:"
          find . -maxdepth 3 \( -name "build.gradle" -o -name "build.gradle.kts" -o -name "settings.gradle" -o -name "settings.gradle.kts" \) -print


      # --------------------------------------------------
      # 7. Setup Java
      # --------------------------------------------------
      - name: Setup Java 17
        if: steps.check.outputs.UPDATE_FOUND == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle


      # --------------------------------------------------
      # 8. Setup Android SDK
      # --------------------------------------------------
      - name: Setup Android SDK
        if: steps.check.outputs.UPDATE_FOUND == 'true'
        uses: android-actions/setup-android@v3


      # --------------------------------------------------
      # 9. Install common Android SDK components
      # --------------------------------------------------
      - name: Install Android SDK components
        if: steps.check.outputs.UPDATE_FOUND == 'true'
        run: |
          echo "Updating Android SDK package list..."

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          echo "Android SDK setup completed."


      # --------------------------------------------------
      # 10. Fix missing AppTheme
      # --------------------------------------------------
      - name: Fix missing AppTheme for test build
        if: steps.check.outputs.UPDATE_FOUND == 'true'
        working-directory: downloaded-hermes
        run: |
          echo "Checking Android AppTheme..."

          MANIFEST="app/src/main/AndroidManifest.xml"
          VALUES_DIR="app/src/main/res/values"

          if [ ! -f "$MANIFEST" ]; then
            echo "ERROR: AndroidManifest.xml not found."
            exit 1
          fi

          if grep -q '@style/AppTheme' "$MANIFEST"; then

            echo "AndroidManifest requires AppTheme."

            mkdir -p "$VALUES_DIR"

            FOUND_THEME=false

            if grep -R 'name="AppTheme"' app/src/main/res/values 2>/dev/null; then
              FOUND_THEME=true
            fi

            if [ "$FOUND_THEME" = "true" ]; then

              echo "AppTheme already exists."
              echo "No change required."

            else

              echo "AppTheme is missing."
              echo "Creating temporary AppTheme for test build..."

              cat > "$VALUES_DIR/hermes-test-theme.xml" <<'EOF'
<?xml version="1.0" encoding="utf-8"?>
<resources>

    <style name="AppTheme" parent="@android:style/Theme.Material.Light.NoActionBar">
        <item name="android:windowNoTitle">true</item>
    </style>

</resources>
EOF

              echo "Temporary AppTheme created."

            fi

          else

            echo "AndroidManifest does not reference AppTheme."
            echo "No theme repair required."

          fi


      # --------------------------------------------------
      # 11. Find Gradle wrapper
      # --------------------------------------------------
      - name: Check Gradle wrapper
        if: steps.check.outputs.UPDATE_FOUND == 'true'
        working-directory: downloaded-hermes
        run: |
          echo "Checking Gradle wrapper..."

          if [ ! -f "./gradlew" ]; then
            echo "ERROR: gradlew was not found."
            echo "This Android project does not contain a Gradle wrapper."
            exit 1
          fi

          chmod +x ./gradlew

          echo "Gradle wrapper found."

          ./gradlew --version


      # --------------------------------------------------
      # 12. Check Java and Gradle versions
      # --------------------------------------------------
      - name: Check Java and Gradle versions
        if: steps.check.outputs.UPDATE_FOUND == 'true'
        working-directory: downloaded-hermes
        run: |
          echo "Java version:"
          java -version

          echo ""
          echo "Gradle version:"
          ./gradlew --version


      # --------------------------------------------------
      # 13. Build APK
      # --------------------------------------------------
      - name: Build APK
        if: steps.check.outputs.UPDATE_FOUND == 'true'
        working-directory: downloaded-hermes
        run: |
          echo "======================================"
          echo "BUILDING HERMES APK"
          echo "======================================"

          chmod +x ./gradlew

          ./gradlew assembleDebug --no-daemon --stacktrace

          echo "======================================"
          echo "APK BUILD COMPLETED"
          echo "======================================"


      # --------------------------------------------------
      # 14. Verify APK
      # --------------------------------------------------
      - name: Verify APK
        if: steps.check.outputs.UPDATE_FOUND == 'true'
        working-directory: downloaded-hermes
        run: |
          echo "Checking generated APK..."

          APK_COUNT=$(find . -type f -name "*.apk" | wc -l)

          echo "APK files found: $APK_COUNT"

          if [ "$APK_COUNT" -eq 0 ]; then
            echo "ERROR: No APK was generated."
            exit 1
          fi

          echo ""
          echo "Generated APK files:"

          find . -type f -name "*.apk" -print

          echo ""
          echo "APK verification PASSED."


      # --------------------------------------------------
      # 15. Upload APK as GitHub Actions artifact
      # --------------------------------------------------
      - name: Upload APK
        if: steps.check.outputs.UPDATE_FOUND == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: hermes-latest-test-apk
          path: downloaded-hermes/**/*.apk
          if-no-files-found: error


      # --------------------------------------------------
      # 16. Update detected message
      # --------------------------------------------------
      - name: Update detected
        if: steps.check.outputs.UPDATE_FOUND == 'true'
        run: |
          echo "======================================"
          echo "NEW HERMES UPDATE DETECTED"
          echo "======================================"

          echo "Repo 2 source downloaded."
          echo "Source verification PASSED."
          echo "Android build completed."
          echo "APK verification PASSED."
          echo "APK uploaded as GitHub Actions artifact."

          echo "======================================"


      # --------------------------------------------------
      # 17. No update message
      # --------------------------------------------------
      - name: No update
        if: steps.check.outputs.UPDATE_FOUND == 'false' && steps.check.outputs.FIRST_RUN != 'true'
        run: |
          echo "======================================"
          echo "NO NEW HERMES UPDATE"
          echo "======================================"

          echo "Repo 2 is unchanged."

          echo "======================================"
