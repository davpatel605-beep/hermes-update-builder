name: Check Hermes Update

on:
  workflow_dispatch:

  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

jobs:
  check-update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Update Builder
        uses: actions/checkout@v6

      - name: Check Repo 2 latest commit
        id: check
        env:
          REPO2: https://github.com/davpatel605-beep/hermes-android-test-source.git
        run: |
          echo "Checking Repo 2..."

          LATEST_COMMIT=$(git ls-remote "$REPO2" refs/heads/main | awk '{print $1}')

          if [ -z "$LATEST_COMMIT" ]; then
            echo "ERROR: Could not read Repo 2."
            exit 1
          fi

          echo "Latest Repo 2 commit:"
          echo "$LATEST_COMMIT"

          mkdir -p config

          if [ ! -f config/repo2-commit.txt ]; then
            echo "$LATEST_COMMIT" > config/repo2-commit.txt
            echo "FIRST_RUN=true" >> "$GITHUB_OUTPUT"
            echo "UPDATE_FOUND=false" >> "$GITHUB_OUTPUT"
            echo "First run. Baseline saved."

          else
            OLD_COMMIT=$(cat config/repo2-commit.txt)

            echo "Previous commit:"
            echo "$OLD_COMMIT"

            if [ "$OLD_COMMIT" = "$LATEST_COMMIT" ]; then
              echo "UPDATE_FOUND=false" >> "$GITHUB_OUTPUT"
              echo "No new update found."

            else
              echo "$LATEST_COMMIT" > config/repo2-commit.txt
              echo "UPDATE_FOUND=true" >> "$GITHUB_OUTPUT"
              echo "NEW UPDATE FOUND!"
            fi
          fi

      - name: Save detected version
        if: steps.check.outputs.UPDATE_FOUND == 'true' || steps.check.outputs.FIRST_RUN == 'true'
        run: |
          git config user.name "Hermes Update Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add config/repo2-commit.txt

          git commit -m "Update tracked Hermes source version" || echo "Nothing to commit"

          git push

      - name: Download latest Repo 2 source
        if: steps.check.outputs.UPDATE_FOUND == 'true'
        env:
          REPO2: https://github.com/davpatel605-beep/hermes-android-test-source.git
        run: |
          echo "Downloading latest Repo 2 source..."

          rm -rf downloaded-hermes

          git clone --depth 1 "$REPO2" downloaded-hermes

          echo "Repo 2 downloaded successfully."

          find downloaded-hermes -maxdepth 5 -type f \
            ! -path "*/.git/*" | sort

      - name: Verify downloaded Android project
        if: steps.check.outputs.UPDATE_FOUND == 'true'
        run: |
          echo "Checking Android project..."

          test -f downloaded-hermes/settings.gradle.kts
          test -f downloaded-hermes/build.gradle.kts
          test -f downloaded-hermes/app/build.gradle.kts
          test -f downloaded-hermes/app/src/main/AndroidManifest.xml
          test -f downloaded-hermes/app/src/main/java/com/example/hermestest/MainActivity.java

          echo "Android project verification PASSED."

      - name: Setup JDK 17
        if: steps.check.outputs.UPDATE_FOUND == 'true'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        if: steps.check.outputs.UPDATE_FOUND == 'true'
        uses: android-actions/setup-android@v4

      - name: Install Android SDK components
        if: steps.check.outputs.UPDATE_FOUND == 'true'
        run: |
          echo "Installing required Android SDK components..."

          sdkmanager "platforms;android-37" "build-tools;36.0.0"

          yes | sdkmanager --licenses > /dev/null || true

          echo "Android SDK setup completed."

      - name: Setup Gradle 9.5.0
        if: steps.check.outputs.UPDATE_FOUND == 'true'
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.5.0'

      - name: Check Java and Gradle versions
        if: steps.check.outputs.UPDATE_FOUND == 'true'
        run: |
          echo "Java version:"
          java -version

          echo ""
          echo "Gradle version:"
          gradle --version

      - name: Build APK
        if: steps.check.outputs.UPDATE_FOUND == 'true'
        working-directory: downloaded-hermes
        run: |
          echo "Starting Android APK build..."

          gradle assembleDebug --no-daemon

          echo "APK build completed."

      - name: Verify APK
        if: steps.check.outputs.UPDATE_FOUND == 'true'
        run: |
          echo "Searching for APK..."

          APK_PATH=$(find downloaded-hermes/app/build/outputs/apk \
            -type f \
            -name "*.apk" | head -n 1)

          if [ -z "$APK_PATH" ]; then
            echo "ERROR: APK was not created."
            exit 1
          fi

          echo "APK FOUND:"
          echo "$APK_PATH"

      - name: Upload APK
        if: steps.check.outputs.UPDATE_FOUND == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: hermes-test-apk
          path: downloaded-hermes/app/build/outputs/apk/**/*.apk
          if-no-files-found: error

      - name: Update detected
        if: steps.check.outputs.UPDATE_FOUND == 'true'
        run: |
          echo "=================================="
          echo "NEW HERMES UPDATE DETECTED"
          echo "Repo 2 source downloaded"
          echo "Android project verified"
          echo "APK BUILD SUCCESSFUL"
          echo "APK uploaded as GitHub Artifact"
          echo "=================================="

      - name: No update
        if: steps.check.outputs.UPDATE_FOUND == 'false' && steps.check.outputs.FIRST_RUN != 'true'
        run: |
          echo "No new Hermes update."
          echo "Repo 2 is unchanged."
